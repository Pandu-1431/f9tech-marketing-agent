# Whole product on one computer: `docker compose up -d --build`, then open http://localhost:3000
#   db      Postgres 16 (data kept in the "pgdata" volume)
#   web     the app
#   worker  background jobs: planning, writing, posters, videos, publishing, results
# AI keys and storage come from .env.docker (copy .env.docker.example).
name: marketing-agent

x-app: &app
  build: .
  image: marketing-agent:local
  env_file: .env.docker
  environment:
    DATABASE_URL: postgres://agent:agent@db:5432/agent
    AGENT_INLINE_JOBS: "false"
    APP_URL: ${APP_URL:-http://localhost:3000}
    STORAGE_LOCAL_DIR: /app/.data/uploads
  volumes:
    - uploads:/app/.data/uploads
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # for `npm run copy:data` from this Mac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *app
    command: ["npx", "tsx", "scripts/worker.ts"]
    stop_grace_period: 30s

volumes:
  pgdata:
  uploads:
