# /etc/nginx/sites-available/agent  (setup-droplet.sh writes this with your domain)
# certbot --nginx adds the HTTPS server block and the certificate lines.
server {
    listen 80;
    server_name DOMAIN;

    client_max_body_size 25m;          # logo / product shot uploads (app limit is 20 MB)

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace (not append) so a client cannot forge its IP; matches TRUSTED_PROXY_HOPS=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;       # long AI server actions
    }
}
